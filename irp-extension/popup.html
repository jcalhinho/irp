<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRP Extension</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1e; color: #e0e0e0; }
  .header { background: linear-gradient(135deg, #4CAF50, #2196F3); padding: 16px; text-align: center; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 11px; opacity: 0.9; margin-top: 2px; }
  .section { padding: 14px 16px; border-bottom: 1px solid #1e1e3a; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 10px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row label { font-size: 14px; }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 24px; transition: 0.3s; }
  .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
  input:checked + .slider { background: #4CAF50; }
  input:checked + .slider:before { transform: translateX(20px); }
  .select-row { margin-top: 10px; }
  .select-row label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }
  select { width: 100%; padding: 6px 8px; background: #1a1a2e; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; font-size: 13px; }
  input[type="text"] { width: 100%; padding: 6px 8px; background: #1a1a2e; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; font-size: 13px; margin-top: 4px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #1a1a2e; padding: 10px; border-radius: 8px; text-align: center; }
  .stat-value { font-size: 20px; font-weight: 700; color: #4CAF50; }
  .stat-label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 2px; }
  .btn { width: 100%; padding: 8px; background: #333; color: #e0e0e0; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn-danger { background: #c62828; }
  .btn-danger:hover { background: #d32f2f; }
  .footer { padding: 10px 16px; text-align: center; font-size: 10px; color: #555; }
</style>
</head>
<body>
  <div class="header">
    <h1>⚡ IRP</h1>
    <p>Intent Rendering Protocol</p>
  </div>

  <div class="section">
    <div class="toggle-row">
      <label>Interception active</label>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <h2>Renderer</h2>
    <div class="select-row">
      <label>Préférence</label>
      <select id="renderer">
        <option value="auto">Auto (Chrome → WebLLM → SGP)</option>
        <option value="chrome">Chrome Prompt API</option>
        <option value="webllm">WebLLM (Qwen 0.5B)</option>
        <option value="sgp">SGP API (claude-qwen)</option>
      </select>
    </div>
    <div class="select-row">
      <label>Proxy SGP (URL)</label>
      <input type="text" id="sgpProxy" placeholder="http://localhost:8001/__proxy/sgp">
    </div>
  </div>

  <div class="section">
    <h2>Statistiques</h2>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="stat-intercepted">0</div>
        <div class="stat-label">Interceptés</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-rendered">0</div>
        <div class="stat-label">Rendus</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-cached">0</div>
        <div class="stat-label">Cache hits</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-errors">0</div>
        <div class="stat-label">Erreurs</div>
      </div>
    </div>
    <button class="btn btn-danger" id="clearStats">Réinitialiser les stats</button>
  </div>

  <div class="footer">
    IRP v1.0 — Le web qui se code lui-même
  </div>

  <script src="popup.js"></script>
</body>
</html>
